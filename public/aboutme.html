<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Senior Software Engineer & Android Specialist CV - Eldhose Mathokkil Babu">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="aboutme.css">

  <!-- Prevent FOUC (Flash of Unstyled Content) by setting light/dark theme immediately -->
  <meta name="color-scheme" content="light dark">
  <script>
    {
      const colorScheme = localStorage.getItem("color-scheme");
      if (colorScheme) {
        document.querySelector('meta[name="color-scheme"]').content = colorScheme;
        document.documentElement.setAttribute('data-theme', colorScheme);
      } else {
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute('data-theme', systemPrefersDark ? 'dark' : 'light');
      }
    }
  </script>
</head>

<body>
  <!-- Background decorations -->
  <div class="bg-decorations" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Floating Controls -->
  <header class="floating-header no-print">
    <div class="controls-wrapper">
      <a href="/" class="btn btn-secondary" aria-label="Go Home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align: middle;">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        Home
      </a>
      <button id="print-btn" class="btn btn-primary" aria-label="Print or Save Resume as PDF">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align: middle;">
          <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z" />
        </svg>
        Print / Save PDF
      </button>
      <button id="theme-toggle" class="btn btn-secondary" aria-label="Toggle Light and Dark Mode">
        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align: middle;">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.02 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.02 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.02 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.02 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.02-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.02.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.02-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.02.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z" />
        </svg>
        <span class="theme-text">Toggle Theme</span>
      </button>
    </div>
  </header>

  <!-- Content Container -->
  <main class="cv-wrapper">
    <!-- Rendered Markdown Container -->
    <article id="cv-content" class="markdown-body">
      <div class="loader">Loading CV content...</div>
    </article>
  </main>

  <footer class="cv-footer no-print">
    <p>&copy; 2026 Eldhose Mathokkil Babu. Built dynamically from <a href="CV.md">CV.md</a>.</p>
  </footer>

  <!-- Floating Ask AI Trigger -->
  <button id="selection-ai-btn" class="selection-ai-btn no-print hidden">✨ Ask AI</button>

  <!-- AI Modal Assistant -->
  <dialog id="ai-modal" class="ai-modal no-print">
    <div class="ai-modal-header">
      <h3>✨ AI Resume Editor</h3>
      <button id="close-ai-modal" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="ai-modal-body">
      <div class="field-group">
        <label>Selected Text:</label>
        <blockquote id="ai-selected-text"></blockquote>
      </div>
      <div class="field-group">
        <label for="ai-instruction">Instructions for AI:</label>
        <textarea id="ai-instruction" rows="3"
          placeholder="e.g. Make this sound like a tech lead, shorten it, focus on Kotlin..."></textarea>
      </div>
      <button id="ai-copy-prompt-btn" class="btn btn-primary btn-full">Copy AI Prompt</button>
    </div>
  </dialog>

  <!-- Marked Markdown Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="aboutme.js"></script>
</body>

</html>
